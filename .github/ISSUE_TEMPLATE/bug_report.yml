name: Bug report
description: Report something broken in Tag.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Tag more reliable. Please do not upload private screenshots, real emails, addresses, tokens, model files, or app databases unless they are fully redacted.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: Tag created a reminder without source evidence after importing a screenshot.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Import / share extension
        - OCR / extraction
        - Intent detection
        - Today cards
        - Source evidence
        - Spaces
        - Chat / retrieval
        - Notifications
        - Model setup
        - Performance / jank
        - Build / signing
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the live app flow you used.
      placeholder: |
        1. Launch Tag on a fresh simulator.
        2. Import one redacted screenshot through Photos.
        3. Open Today.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The card should link to the imported source preview.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: The card appears, but the source preview fails to open.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
      placeholder: 1.0.0 (2), commit SHA, or branch name
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: iPhone 16 simulator, iOS 26.2.1
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add sanitized screenshots, logs, or timings. Redact private saved content first.
  - type: checkboxes
    id: checks
    attributes:
      label: Privacy check
      options:
        - label: I have removed or redacted private screenshots, personal data, tokens, databases, and model files from this report.
          required: true
