name: PR Acceptance Gate

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
  issue_comment:
    types:
      - created
      - edited
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  checks: read
  issues: read
  pull-requests: read

jobs:
  gate:
    name: Tag PR acceptance gate
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Evaluate PR acceptance requirements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_CHECK_NAME: Tag PR acceptance gate
          REQUIRED_CHECKS: Flutter analyze and test
          GREPTILE_REQUIRED_SCORE: 5/5
        run: node scripts/pr_acceptance_gate.mjs
